name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COMMERCE_TEST_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
      COMMERCE_TEST_DB_HOST: localhost
      COMMERCE_TEST_DB_PORT: "5432"
      COMMERCE_TEST_ROLE_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run pytest

  config-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run python -m tools.checks.config_reference --check

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run lint-imports
      - name: W8a AST checks
        run: uv run python -m tools.checks.ast_rules
      - name: Compiled translations are up to date (L3)
        run: |
          sudo apt-get install -y gettext >/dev/null
          for po in $(find src -name '*.po'); do
            msgfmt --check -o /tmp/check.mo "$po"
            cmp /tmp/check.mo "${po%.po}.mo"
          done

  migrations:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: tools.ci_settings
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - name: makemigrations --check (D2f)
        run: uv run django-admin makemigrations --check --dry-run
      - name: Blocking and destructive migrations (D2, D2b, D2c, D3)
        run: |
          current=$(git describe --tags --exact-match 2>/dev/null || true)
          previous=$(git tag --sort=-v:refname --merged HEAD | grep -vx "${current:-__none__}" | head -1)
          uv run python -m tools.checks.migration_safety ${previous:+--previous-tag "$previous"}

  migration-review:
    # D1: every changed migration's SQL is posted for a human to read, and the
    # PR cannot pass until the author ticks the D1 box.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI_DB_NAME: postgres
      CI_DB_USER: postgres
      CI_DB_PASSWORD: postgres
      CI_DB_HOST: localhost
      GH_TOKEN: ${{ github.token }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - name: Post migration SQL and require the D1 checkbox
        run: |
          set +e
          uv run python -m tools.checks.sqlmigrate_comment "origin/${{ github.base_ref }}" > d1.md
          status=$?
          set -e
          if [ "$status" = "0" ]; then echo "No migrations changed."; exit 0; fi
          if [ "$status" != "3" ]; then cat d1.md; exit "$status"; fi
          gh pr comment "${{ github.event.pull_request.number }}" --body-file d1.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file d1.md
          if ! printf '%s' "$PR_BODY" | grep -qiE '^- \[x\] Migrations and SQL read'; then
            echo "D1: tick 'Migrations and SQL read' in the PR description after reading the SQL."
            exit 1
          fi

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - name: Lockfile is current and hash-pinned
        run: |
          uv lock --check
          uv export --format requirements-txt --no-dev --no-emit-project --hashes --locked -o /tmp/requirements.lock
          diff -u <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.lock)
      - name: Install from hashes only
        run: |
          python -m venv /tmp/hashcheck
          /tmp/hashcheck/bin/pip install --require-hashes --no-deps -r requirements.lock
      - name: pip-audit
        run: uvx --from pip-audit==2.10.1 pip-audit -r requirements.lock --disable-pip --no-deps

  release-gates:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - name: Changelog entry and version match the tag (W4)
        run: uv run python -m tools.checks.changelog_check "${GITHUB_REF_NAME}"
      - name: No error code removed or changed (X8)
        run: |
          previous=$(git tag --sort=-v:refname --merged HEAD | grep -vx "${GITHUB_REF_NAME}" | head -1)
          if [ -n "$previous" ]; then uv run python -m tools.checks.registry_diff "$previous"; else echo "First release."; fi

  upgrade-path:
    # D2, W5, W4a: migrate a database at the previous minor holding seed_demo
    # data, run the previous release's suite against it, and diff port
    # signatures. Not applicable to the first release (0.1.0); enabled from 0.2.0.
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "enabled from the second release"

  clean-install:
    # W8 clean-install test (W1, W1a, W1b, W2, W3; decision 24): core is
    # installed by git+ssh with the read-only CORE_DEPLOY_KEY into the blank
    # template cloned with TEMPLATE_DEPLOY_KEY, then bootstrapped, released,
    # booted and smoke-tested.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy keys for the two private repositories
        env:
          CORE_DEPLOY_KEY: ${{ secrets.CORE_DEPLOY_KEY }}
          TEMPLATE_DEPLOY_KEY: ${{ secrets.TEMPLATE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CORE_DEPLOY_KEY" > ~/.ssh/core_key
          printf '%s\n' "$TEMPLATE_DEPLOY_KEY" > ~/.ssh/template_key
          chmod 600 ~/.ssh/core_key ~/.ssh/template_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'CFG'
          Host github-core
            HostName github.com
            User git
            IdentityFile ~/.ssh/core_key
            IdentitiesOnly yes
          Host github-template
            HostName github.com
            User git
            IdentityFile ~/.ssh/template_key
            IdentitiesOnly yes
          CFG
      - name: Clone the blank deployment template
        run: git clone --depth 1 git@github-template:${{ github.repository_owner }}/commerce-deployment-template.git ../commerce-deployment-template
      - name: Install core by git+ssh, bootstrap, release, boot, smoke
        env:
          TEMPLATE_DIR: ../commerce-deployment-template
          OWNER_URL: postgresql://postgres:postgres@localhost:5432/postgres
          CORE_SPEC: commerce-core @ git+ssh://github-core/${{ github.repository }}.git@${{ github.sha }}
          PYTHON: python
        run: tools/clean_install.sh
