name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COMMERCE_TEST_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
      COMMERCE_TEST_DB_HOST: localhost
      COMMERCE_TEST_DB_PORT: "5432"
      COMMERCE_TEST_ROLE_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run pytest

  config-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run python -m tools.checks.config_reference --check

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run lint-imports
      - name: W8a AST checks
        run: uv run python -m tools.checks.ast_rules
      - name: Compiled translations are up to date (L3)
        run: |
          sudo apt-get install -y gettext >/dev/null
          for po in $(find src -name '*.po'); do
            msgfmt --check -o /tmp/check.mo "$po"
            cmp /tmp/check.mo "${po%.po}.mo"
          done

  migrations:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: tools.ci_settings
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - name: makemigrations --check (D2f)
        run: uv run django-admin makemigrations --check --dry-run
      - name: Blocking and destructive migrations (D2, D2b, D2c, D3)
        run: |
          current=$(git describe --tags --exact-match 2>/dev/null || true)
          previous=$(git tag --sort=-v:refname --merged HEAD | grep -vx "${current:-__none__}" | head -1)
          uv run python -m tools.checks.migration_safety ${previous:+--previous-tag "$previous"}
